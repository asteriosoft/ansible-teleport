---
teleport_version: "16.4.2"
teleport_package: "teleport"  # use teleport-ent for enterprise edition
teleport_url: "https://cdn.teleport.dev/{{ teleport_package }}-v{{ teleport_version }}-linux-amd64-bin.tar.gz"
teleport_config_path: "/etc/teleport.yaml"
teleport_pidfile: "/run/teleport.pid"
teleport_start_options: ""  #  teleport start --help
teleport_nodename: "{{ ansible_hostname }}"
teleport_auth_token: ""
#teleport_proxy_server: "teleport-proxy.example.com:443"
#teleport_auth_server: "10.1.0.5:3025"
#teleport_advertise_ip: "{{ ansible_host }}"
#teleport_diag_addr: "127.0.0.1:3000"
teleport_log_output: "/var/log/teleport/teleport.log"
teleport_log_level: "INFO"
teleport_log_format: "text"

