---
- name: Download and unarchive teleport package
  unarchive:
    src: "{{ teleport_url }}"
    dest: /tmp
    remote_src: yes

- name: Install teleport
  command: ./install
  args:
    chdir: /tmp/teleport
  ignore_errors: '{{ ansible_check_mode }}'
  
- name: Create teleport config
  template:
    src: "teleport.yaml.j2"
    dest: "{{ teleport_config_path }}"
    owner: "root"
    group: "root"
    mode: 0600
  tags: config

- name: Copy logrotate config for teleport logs
  template:
    src: teleport.logrotate.j2
    dest: /etc/logrotate.d/teleport
    owner: root
    group: root
    mode: 0644
  when: 
    - teleport_log_output != "syslog"
    - teleport_log_output != "stdout"
    - teleport_log_output != "stderr"

- name: Create systemd unit for teleport service
  import_tasks: 'systemd.yml'
  when: ansible_service_mgr == 'systemd'

- name: Restarting teleport
  service:
    name: teleport
    enabled: yes
    state: restarted
  ignore_errors: '{{ ansible_check_mode }}'
